# Optional: use only for Mellanox NICs with Secure Boot enabled.
# Configure firmware SR-IOV capacity before enabling Secure Boot.
# Merge with the existing SriovOperatorConfig and preserve other exclusions.
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovOperatorConfig
metadata:
  name: default
  namespace: openshift-sriov-network-operator
  annotations:
    ran.openshift.io/ztp-deploy-wave: "10"
spec:
  disablePlugins:
    - mellanox
